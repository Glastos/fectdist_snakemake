# Test data for the local profile: 1 M read pairs per lane of two drone pools
# (see README, "Local test"). Only the values below differ from config/config.yaml.
targets: [gvcf]   # the test covers the whole pipeline
samples: config/test/samples.tsv
units: config/test/units.tsv
regions:
  include: [NC_037653.1]   # smallest chromosome (7.2 Mb): keeps the test ~30 min
qc:
  allele_balance:
    min_depth: 3   # test reads cover ~2x
